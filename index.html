<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>huutt - 互動式測驗平台</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Canvas Confetti -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    
    <!-- Firebase SDK (v9 Compatibility Mode - Realtime Database) -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            purple: '#1e40af',
                            blue: '#2563eb',
                            red: '#e21b3c',
                            yellow: '#ffa602',
                            green: '#22c55e',
                            dark: '#0f172a'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap');
        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: #f8fafc;
        }
        .bg-pattern {
            background-color: #1e3a8a;
            background-image: radial-gradient(#3b82f6 2px, transparent 2px);
            background-size: 32px 32px;
        }
        .btn-option {
            transition: transform 0.1s ease, box-shadow 0.1s ease;
        }
        .btn-option:active {
            transform: translateY(4px);
            box-shadow: none !important;
        }
    </style>
</head>
<body class="bg-pattern min-h-screen text-slate-800 flex flex-col justify-between selection:bg-brand-yellow selection:text-black">

    <!-- Header / Navbar -->
    <header class="bg-white/10 backdrop-blur-md border-b border-white/20 p-4 sticky top-0 z-50">
        <div class="max-w-5xl mx-auto flex justify-between items-center">
            <div class="flex items-center space-x-3 cursor-pointer" onclick="goHome()">
                <div class="bg-brand-yellow text-brand-dark p-2 rounded-xl font-black text-2xl tracking-tighter shadow-lg rotate-3">
                    h!
                </div>
                <span class="text-3xl font-black text-white tracking-wider drop-shadow">huutt</span>
            </div>
            
            <div class="flex items-center space-x-2">
                <span id="currentRoomTag" class="hidden bg-white/20 text-white px-3 py-1 rounded-full text-sm font-bold border border-white/30">
                    測驗碼: <span id="displayCodeTag"></span>
                </span>
            </div>
        </div>
    </header>

    <!-- Main Content Area Container -->
    <main class="max-w-4xl mx-auto w-full p-4 flex-grow flex flex-col justify-center my-6">

        <!-- 1. HOME SCREEN: Enter Room / Name -->
        <div id="screenHome" class="bg-white rounded-3xl p-6 md:p-10 shadow-2xl text-center max-w-md mx-auto w-full border-4 border-white/20">
            <h1 class="text-4xl font-black text-blue-600 mb-2">準備好挑戰了嗎？</h1>
            <p class="text-slate-500 mb-8 font-medium">輸入測驗碼與名字即可開始測驗！</p>
            
            <div class="space-y-4">
                <div>
                    <label class="block text-left text-xs font-bold text-slate-400 mb-1 uppercase tracking-wider">測驗碼</label>
                    <input type="text" id="inputQuizCode" placeholder="例如：MATH101" 
                           class="w-full px-4 py-3 border-2 border-slate-200 rounded-2xl font-bold text-slate-700 text-center uppercase text-xl focus:border-blue-600 focus:outline-none transition">
                </div>
                <div>
                    <label class="block text-left text-xs font-bold text-slate-400 mb-1 uppercase tracking-wider">玩家名稱</label>
                    <input type="text" id="inputPlayerName" placeholder="請輸入你的暱稱" 
                           class="w-full px-4 py-3 border-2 border-slate-200 rounded-2xl font-bold text-slate-700 text-center text-xl focus:border-blue-600 focus:outline-none transition" maxlength="15">
                </div>
                <button type="button" onclick="handleJoin()" 
                        class="w-full bg-blue-600 hover:bg-blue-700 text-white font-black text-xl py-4 rounded-2xl shadow-[0_6px_0_#1e40af] active:shadow-none active:translate-y-1 transition-all">
                    開始測驗
                </button>
            </div>
        </div>

        <!-- 2. QUIZ SCREEN: Question & Options -->
        <div id="screenQuiz" class="hidden w-full flex-col space-y-6">
            <div class="bg-white/90 backdrop-blur p-4 rounded-2xl shadow-md flex justify-between items-center">
                <div class="text-slate-600 font-bold">
                    題目 <span id="qCurrentIndex" class="text-blue-600 text-xl">1</span> / <span id="qTotalCount">10</span>
                </div>
                <div class="flex items-center space-x-2">
                    <i class="fa-solid fa-stopwatch text-brand-red text-xl"></i>
                    <span id="timerText" class="text-2xl font-black text-brand-red w-8 text-center">20</span>
                </div>
                <div class="text-right">
                    <span class="text-xs text-slate-400 block font-bold">當前分數</span>
                    <span id="liveScore" class="text-xl font-black text-blue-600">0</span>
                </div>
            </div>

            <div class="bg-white rounded-3xl p-6 md:p-8 shadow-xl text-center border-b-8 border-slate-200 flex flex-col items-center justify-center space-y-4">
                <h2 id="questionTitle" class="text-2xl md:text-3xl font-black text-slate-800 leading-relaxed">
                    題目載入中...
                </h2>
                <div id="questionImageContainer" class="hidden w-full max-h-64 overflow-hidden rounded-2xl border border-slate-200">
                    <img id="questionImage" src="" alt="題目圖片" class="w-full h-full object-contain mx-auto max-h-60">
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <button onclick="submitAnswer(0)" class="btn-option bg-brand-red text-white p-6 rounded-2xl text-left font-black text-xl flex items-center space-x-4 shadow-[0_6px_0_#a8132b]">
                    <span class="bg-white/20 rounded-lg w-10 h-10 flex items-center justify-center flex-shrink-0"><i class="fa-solid fa-play rotate-[-90deg]"></i></span>
                    <span id="opt0" class="flex-grow break-all">選項 1</span>
                </button>
                <button onclick="submitAnswer(1)" class="btn-option bg-brand-blue text-white p-6 rounded-2xl text-left font-black text-xl flex items-center space-x-4 shadow-[0_6px_0_#1d4ed8]">
                    <span class="bg-white/20 rounded-lg w-10 h-10 flex items-center justify-center flex-shrink-0"><i class="fa-solid fa-diamond"></i></span>
                    <span id="opt1" class="flex-grow break-all">選項 2</span>
                </button>
                <button onclick="submitAnswer(2)" class="btn-option bg-brand-yellow text-white p-6 rounded-2xl text-left font-black text-xl flex items-center space-x-4 shadow-[0_6px_0_#cc8502]">
                    <span class="bg-white/20 rounded-lg w-10 h-10 flex items-center justify-center flex-shrink-0"><i class="fa-solid fa-circle"></i></span>
                    <span id="opt2" class="flex-grow break-all">選項 3</span>
                </button>
                <button onclick="submitAnswer(3)" class="btn-option bg-brand-green text-white p-6 rounded-2xl text-left font-black text-xl flex items-center space-x-4 shadow-[0_6px_0_#15803d]">
                    <span class="bg-white/20 rounded-lg w-10 h-10 flex items-center justify-center flex-shrink-0"><i class="fa-solid fa-square"></i></span>
                    <span id="opt3" class="flex-grow break-all">選項 4</span>
                </button>
            </div>
        </div>

        <!-- 3. FEEDBACK SCREEN -->
        <div id="screenFeedback" class="hidden text-center py-12 flex-col items-center justify-center space-y-6">
            <div id="feedbackIcon" class="text-8xl animate-bounce"></div>
            <h2 id="feedbackText" class="text-4xl font-black text-white drop-shadow-md"></h2>
            <div class="bg-white/90 backdrop-blur px-8 py-4 rounded-2xl text-2xl font-bold text-slate-700 shadow-xl">
                獲得分數: <span id="addedScore" class="text-brand-green font-black">+0</span>
            </div>
        </div>

        <!-- 4. LEADERBOARD / RESULT SCREEN -->
        <div id="screenLeaderboard" class="hidden bg-white rounded-3xl p-6 md:p-8 shadow-2xl w-full max-w-2xl mx-auto">
            <div class="text-center mb-6">
                <i class="fa-solid fa-trophy text-brand-yellow text-6xl mb-2 drop-shadow"></i>
                <h2 id="boardQuizTitle" class="text-3xl font-black text-blue-600">英雄榜</h2>
                <p class="text-slate-500 font-bold mt-1">測驗碼: <span id="boardQuizCode" class="text-blue-500"></span></p>
            </div>

            <div id="leaderboardList" class="space-y-3 mb-8 max-h-96 overflow-y-auto pr-2"></div>

            <div class="flex space-x-4">
                <button onclick="goHome()" class="w-full bg-slate-200 hover:bg-slate-300 text-slate-700 font-black py-3 rounded-xl transition">回到首頁</button>
                <button onclick="restartQuiz()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-black py-3 rounded-xl shadow-md transition">再測驗一次</button>
            </div>
        </div>

        <!-- 5. ADMIN CREATOR SCREEN -->
        <div id="screenAdmin" class="hidden bg-white rounded-3xl p-6 md:p-8 shadow-2xl w-full max-w-3xl mx-auto">
            <div class="flex justify-between items-center border-b pb-4 mb-6">
                <div>
                    <h2 class="text-2xl font-black text-blue-600"><i class="fa-solid fa-user-shield mr-2"></i>huutt 管理員後台</h2>
                    <p class="text-xs text-slate-400 font-bold">創建測驗主題與題目設定</p>
                </div>
                <button onclick="goHome()" class="text-slate-400 hover:text-slate-600 font-bold text-sm">離開後台</button>
            </div>

            <!-- Quick Import / Export Section -->
            <div class="mb-6 bg-blue-50 p-4 rounded-2xl border border-blue-200 flex flex-col md:flex-row justify-between items-center gap-4">
                <div>
                    <h3 class="font-black text-blue-800 text-sm"><i class="fa-solid fa-file-arrow-down mr-1"></i> 快速匯入 / 匯出測驗</h3>
                    <p class="text-xs text-slate-500 mt-0.5">上傳 JSON 檔快速建立題目，或匯出目前建立的題目備份。</p>
                </div>
                <div class="flex items-center space-x-2 w-full md:w-auto">
                    <label class="cursor-pointer bg-blue-600 hover:bg-blue-700 text-white font-bold text-xs px-4 py-2.5 rounded-xl transition shadow text-center flex-grow md:flex-grow-0">
                        <i class="fa-solid fa-upload mr-1"></i> 匯入 JSON 檔
                        <input type="file" accept=".json" onchange="importQuizFromJson(this)" class="hidden">
                    </label>
                </div>
            </div>

            <div class="mb-8 bg-slate-50 p-4 rounded-2xl border border-slate-200">
                <h3 class="font-black text-slate-700 mb-3 text-sm uppercase tracking-wider"><i class="fa-solid fa-list-check mr-1"></i> 已發布的測驗</h3>
                <div id="adminQuizList" class="space-y-2 max-h-40 overflow-y-auto"></div>
            </div>

            <hr class="my-6">

            <div class="space-y-6">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold text-slate-500 mb-1">測驗主題名稱</label>
                        <input type="text" id="adminQuizTitle" placeholder="例如：數學期末小考" class="w-full p-3 border-2 rounded-xl font-bold border-slate-200 focus:border-blue-600 outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-500 mb-1">自訂測驗碼 (後綴)</label>
                        <input type="text" id="adminQuizCode" placeholder="例如：MATH101" class="w-full p-3 border-2 rounded-xl font-bold uppercase border-slate-200 focus:border-blue-600 outline-none">
                    </div>
                </div>

                <div class="space-y-4">
                    <div class="flex justify-between items-center">
                        <h3 class="font-black text-slate-700">題目列表</h3>
                        <button onclick="addQuestionBlock()" class="bg-blue-600 hover:bg-blue-700 text-white font-bold text-sm px-3 py-2 rounded-xl transition">
                            <i class="fa-solid fa-plus mr-1"></i> 新增題目
                        </button>
                    </div>
                    <div id="questionBlocksContainer" class="space-y-6"></div>
                </div>

                <button onclick="saveQuiz()" class="w-full bg-brand-green hover:bg-green-600 text-white font-black text-xl py-4 rounded-2xl shadow-lg transition mt-6">
                    發布並儲存測驗
                </button>
            </div>
        </div>

    </main>

    <footer class="text-center py-4 text-white/50 text-xs font-bold">
        &copy; huutt Interactive Quiz Platform
    </footer>

    <!-- JavaScript Application Code -->
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBPO6NlHkLUWK2ddkwPvg5ffqb1tnTb6KY",
            authDomain: "huutt-57957.firebaseapp.com",
            databaseURL: "https://huutt-57957-default-rtdb.firebaseio.com",
            projectId: "huutt-57957",
            storageBucket: "huutt-57957.firebasestorage.app",
            messagingSenderId: "190990209749",
            appId: "1:190990209749:web:9a55ec627c82e35f1e085c"
        };

        let rtdb = null;
        try {
            firebase.initializeApp(firebaseConfig);
            rtdb = firebase.database();
        } catch (e) {
            console.warn("Firebase RTDB 初始化失敗，啟用本地模式。");
        }

        let currentQuiz = null;
        let currentQuizCode = "";
        let currentQuestionIdx = 0;
        let userScore = 0;
        let userName = "";
        let timerInterval = null;
        let timeLeft = 20;
        let localQuizzes = JSON.parse(localStorage.getItem('huutt_quizzes') || '{}');
        let globalAllQuizzes = {}; // 用於匯出功能

        const defaultDemoQuiz = {
            title: "huutt 經典體驗測驗",
            code: "DEMO123",
            questions: [
                {
                    title: "世界上最大的海洋是？",
                    options: ["大西洋", "印度洋", "太平洋", "北冰洋"],
                    correct: 2,
                    timeLimit: 15,
                    image: ""
                }
            ]
        };

        window.addEventListener('DOMContentLoaded', () => {
            const hash = window.location.hash.replace('#', '').trim().toUpperCase();
            if(hash) {
                document.getElementById('inputQuizCode').value = hash;
            }
            if (!localQuizzes["DEMO123"]) {
                localQuizzes["DEMO123"] = defaultDemoQuiz;
                localStorage.setItem('huutt_quizzes', JSON.stringify(localQuizzes));
            }
        });

        function hideAllScreens() {
            document.querySelectorAll('main > div').forEach(div => div.classList.add('hidden'));
            document.getElementById('currentRoomTag').classList.add('hidden');
        }

        function goHome() {
            hideAllScreens();
            document.getElementById('screenHome').classList.remove('hidden');
            window.location.hash = '';
            clearInterval(timerInterval);
        }

        async function handleJoin() {
            const codeInput = document.getElementById('inputQuizCode');
            const nameInput = document.getElementById('inputPlayerName');

            if (!codeInput || !nameInput) return;

            const code = codeInput.value.trim().toUpperCase();
            const name = nameInput.value.trim();

            if (code === "ZXCVB123" && name === "管理員") {
                openAdminConsole();
                return;
            }

            if (!code || !name) {
                alert("請輸入測驗碼與名字！");
                return;
            }

            const quiz = await fetchQuizData(code);
            if (!quiz) {
                alert("找不到此測驗碼，請確認後重試！");
                return;
            }

            currentQuiz = quiz;
            currentQuizCode = code;
            userName = name;
            userScore = 0;
            currentQuestionIdx = 0;

            window.location.hash = code;
            document.getElementById('displayCodeTag').innerText = code;
            document.getElementById('currentRoomTag').classList.remove('hidden');

            startQuiz();
        }

        async function fetchQuizData(code) {
            if (rtdb) {
                try {
                    const snapshot = await rtdb.ref('quizzes/' + code).once('value');
                    if (snapshot.exists()) return snapshot.val();
                } catch(err) {
                    console.log("RTDB 讀取失敗，改用本地端");
                }
            }
            return localQuizzes[code] || null;
        }

        function startQuiz() {
            hideAllScreens();
            document.getElementById('screenQuiz').classList.remove('hidden');
            document.getElementById('qTotalCount').innerText = currentQuiz.questions.length;
            loadQuestion();
        }

        function loadQuestion() {
            if (currentQuestionIdx >= currentQuiz.questions.length) {
                finishQuiz();
                return;
            }

            const q = currentQuiz.questions[currentQuestionIdx];
            document.getElementById('qCurrentIndex').innerText = currentQuestionIdx + 1;
            document.getElementById('questionTitle').innerText = q.title;
            document.getElementById('liveScore').innerText = userScore;

            const imgContainer = document.getElementById('questionImageContainer');
            const imgEl = document.getElementById('questionImage');
            if (q.image && q.image.trim() !== "") {
                imgEl.src = q.image;
                imgContainer.classList.remove('hidden');
            } else {
                imgEl.src = "";
                imgContainer.classList.add('hidden');
            }

            q.options.forEach((opt, idx) => {
                document.getElementById(`opt${idx}`).innerText = opt;
            });

            timeLeft = q.timeLimit || 20;
            document.getElementById('timerText').innerText = timeLeft;
            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                timeLeft--;
                document.getElementById('timerText').innerText = timeLeft;
                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    submitAnswer(-1);
                }
            }, 1000);
        }

        function submitAnswer(selectedIdx) {
            clearInterval(timerInterval);
            const q = currentQuiz.questions[currentQuestionIdx];
            const isCorrect = selectedIdx === q.correct;
            
            let pointsGained = 0;
            if (isCorrect) {
                pointsGained = 500 + Math.round((timeLeft / (q.timeLimit || 20)) * 500);
                userScore += pointsGained;
            }

            showFeedback(isCorrect, pointsGained);
        }

        function showFeedback(isCorrect, points) {
            hideAllScreens();
            const feedbackScreen = document.getElementById('screenFeedback');
            feedbackScreen.classList.remove('hidden');

            const iconEl = document.getElementById('feedbackIcon');
            const textEl = document.getElementById('feedbackText');
            const scoreEl = document.getElementById('addedScore');

            if (isCorrect) {
                iconEl.innerHTML = '<i class="fa-solid fa-circle-check text-brand-green"></i>';
                textEl.innerText = "答對了！太厲害了！";
                scoreEl.innerText = `+${points}`;
                scoreEl.className = "text-brand-green font-black";
                confetti({ particleCount: 50, spread: 60, origin: { y: 0.6 } });
            } else {
                iconEl.innerHTML = '<i class="fa-solid fa-circle-xmark text-brand-red"></i>';
                textEl.innerText = "答錯囉！繼續加油！";
                scoreEl.innerText = "+0";
                scoreEl.className = "text-slate-400 font-black";
            }

            setTimeout(() => {
                currentQuestionIdx++;
                if (currentQuestionIdx < currentQuiz.questions.length) {
                    hideAllScreens();
                    document.getElementById('screenQuiz').classList.remove('hidden');
                    loadQuestion();
                } else {
                    finishQuiz();
                }
            }, 2000);
        }

        async function finishQuiz() {
            hideAllScreens();
            document.getElementById('screenLeaderboard').classList.remove('hidden');
            document.getElementById('boardQuizTitle').innerText = currentQuiz.title;
            document.getElementById('boardQuizCode').innerText = currentQuizCode;

            await saveScore(currentQuizCode, userName, userScore);
            renderLeaderboard(currentQuizCode);
        }

        async function saveScore(code, name, score) {
            const entry = { name, score, timestamp: Date.now() };
            if (rtdb) {
                try {
                    await rtdb.ref('leaderboards/' + code).push(entry);
                    return;
                } catch(e) {
                    console.log("RTDB 分數儲存失敗");
                }
            }
            let scores = JSON.parse(localStorage.getItem(`scores_${code}`) || '[]');
            scores.push(entry);
            localStorage.setItem(`scores_${code}`, JSON.stringify(scores));
        }

        async function renderLeaderboard(code) {
            const listContainer = document.getElementById('leaderboardList');
            listContainer.innerHTML = '<div class="text-center text-slate-400 py-4"><i class="fa-solid fa-spinner fa-spin mr-2"></i>載入排行榜中...</div>';

            let scores = [];
            if (rtdb) {
                try {
                    const snapshot = await rtdb.ref('leaderboards/' + code).once('value');
                    if (snapshot.exists()) {
                        snapshot.forEach(childSnap => {
                            scores.push(childSnap.val());
                        });
                    }
                } catch(e) {
                    console.log("RTDB 排行榜讀取失敗");
                }
            }

            if (scores.length === 0) {
                scores = JSON.parse(localStorage.getItem(`scores_${code}`) || '[]');
            }
            scores.sort((a, b) => b.score - a.score);

            listContainer.innerHTML = '';
            if (scores.length === 0) {
                listContainer.innerHTML = `
                    <div class="text-center py-12 bg-slate-50 rounded-2xl border-2 border-dashed border-slate-200">
                        <i class="fa-solid fa-ghost text-slate-300 text-5xl mb-3"></i>
                        <p class="text-slate-500 font-bold text-lg">還未有人測驗</p>
                    </div>`;
                return;
            }

            scores.forEach((item, index) => {
                let medal = `<span class="font-black text-slate-400 w-6">${index + 1}</span>`;
                if (index === 0) medal = '<i class="fa-solid fa-medal text-yellow-500 text-xl w-6"></i>';
                if (index === 1) medal = '<i class="fa-solid fa-medal text-slate-400 text-xl w-6"></i>';
                if (index === 2) medal = '<i class="fa-solid fa-medal text-amber-600 text-xl w-6"></i>';

                const isMe = item.name === userName;
                const row = document.createElement('div');
                row.className = `flex justify-between items-center p-3 rounded-xl ${isMe ? 'bg-blue-50 border-2 border-blue-600' : 'bg-slate-100'}`;
                row.innerHTML = `
                    <div class="flex items-center space-x-3">
                        ${medal}
                        <span class="font-bold text-slate-800 ${isMe ? 'text-blue-600 font-black' : ''}">${escapeHtml(item.name)} ${isMe ? '(你)' : ''}</span>
                    </div>
                    <span class="font-black text-blue-600">${item.score} 分</span>
                `;
                listContainer.appendChild(row);
            });
        }

        function restartQuiz() {
            userScore = 0;
            currentQuestionIdx = 0;
            startQuiz();
        }

        function openAdminConsole() {
            hideAllScreens();
            document.getElementById('screenAdmin').classList.remove('hidden');
            document.getElementById('questionBlocksContainer').innerHTML = '';
            addQuestionBlock();
            renderAdminQuizList();
        }

        function addQuestionBlock() {
            const container = document.getElementById('questionBlocksContainer');
            const qCount = container.children.length + 1;

            const block = document.createElement('div');
            block.className = 'bg-slate-50 p-4 rounded-2xl border-2 border-slate-200 space-y-3 relative';
            block.innerHTML = `
                <div class="flex justify-between items-center">
                    <span class="font-black text-blue-600 text-sm">第 ${qCount} 題</span>
                    ${qCount > 1 ? `<button onclick="this.parentElement.parentElement.remove()" class="text-brand-red font-bold text-xs"><i class="fa-solid fa-trash mr-1"></i>刪除</button>` : ''}
                </div>
                <input type="text" placeholder="輸入題目內容" class="q-title w-full p-2 border rounded-lg text-sm font-bold border-slate-300">
                
                <div class="space-y-1">
                    <label class="text-xs font-bold text-slate-400">上傳題目圖片 (選填)</label>
                    <input type="file" accept="image/*" onchange="handleImageUpload(this)" class="q-image-input w-full text-xs text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-bold file:bg-blue-50 file:text-blue-600 hover:file:bg-blue-100">
                    <input type="hidden" class="q-image-base64">
                    <div class="q-image-preview hidden mt-2">
                        <img src="" alt="預覽圖" class="h-20 object-contain rounded-lg border">
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-2">
                    <input type="text" placeholder="選項 1" class="q-opt-0 p-2 border rounded-lg text-xs border-slate-300">
                    <input type="text" placeholder="選項 2" class="q-opt-1 p-2 border rounded-lg text-xs border-slate-300">
                    <input type="text" placeholder="選項 3" class="q-opt-2 p-2 border rounded-lg text-xs border-slate-300">
                    <input type="text" placeholder="選項 4" class="q-opt-3 p-2 border rounded-lg text-xs border-slate-300">
                </div>
                <div class="flex items-center space-x-4 pt-1">
                    <label class="text-xs font-bold text-slate-500">正確答案選項：</label>
                    <select class="q-correct p-1 border rounded text-xs font-bold bg-white border-slate-300">
                        <option value="0">選項 1</option>
                        <option value="1">選項 2</option>
                        <option value="2">選項 3</option>
                        <option value="3">選項 4</option>
                    </select>
                </div>
            `;
            container.appendChild(block);
        }

        function handleImageUpload(input) {
            const file = input.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const base64Data = e.target.result;
                const parentBlock = input.closest('div').parentElement;
                parentBlock.querySelector('.q-image-base64').value = base64Data;
                
                const previewDiv = parentBlock.querySelector('.q-image-preview');
                const previewImg = previewDiv.querySelector('img');
                previewImg.src = base64Data;
                previewDiv.classList.remove('hidden');
            };
            reader.readAsDataURL(file);
        }

        // 快速匯入 JSON 檔功能
        function importQuizFromJson(input) {
            const file = input.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = async function(e) {
                try {
                    const quizData = JSON.parse(e.target.result);
                    if (!quizData.code || !quizData.title || !quizData.questions) {
                        alert("JSON 格式不正確，必須包含 code、title 與 questions！");
                        return;
                    }

                    // 存入 RTDB 與 LocalStorage
                    if (rtdb) {
                        await rtdb.ref('quizzes/' + quizData.code).set(quizData);
                    }
                    localQuizzes[quizData.code] = quizData;
                    localStorage.setItem('huutt_quizzes', JSON.stringify(localQuizzes));

                    alert(`成功匯入測驗：[${quizData.title}]（測驗碼：${quizData.code}）`);
                    renderAdminQuizList();
                } catch (err) {
                    alert("解析 JSON 檔案失敗，請確認檔案格式是否正確。");
                }
                input.value = ''; // 重置 input
            };
            reader.readAsText(file);
        }

        // 匯出單一測驗為 JSON 檔
        async function exportQuizToJson(code) {
            const quiz = globalAllQuizzes[code];
            if (!quiz) return;

            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(quiz, null, 2));
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", `huutt_quiz_${code}.json`);
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
        }

        async function saveQuiz() {
            const title = document.getElementById('adminQuizTitle').value.trim();
            const code = document.getElementById('adminQuizCode').value.trim().toUpperCase();

            if (!title || !code) {
                alert("請填寫測驗主題與測驗碼！");
                return;
            }

            const blocks = document.querySelectorAll('#questionBlocksContainer > div');
            const questions = [];

            blocks.forEach(b => {
                const qTitle = b.querySelector('.q-title').value.trim();
                const qImage = b.querySelector('.q-image-base64').value || "";
                const opt0 = b.querySelector('.q-opt-0').value.trim();
                const opt1 = b.querySelector('.q-opt-1').value.trim();
                const opt2 = b.querySelector('.q-opt-2').value.trim();
                const opt3 = b.querySelector('.q-opt-3').value.trim();
                const correct = parseInt(b.querySelector('.q-correct').value);

                if (qTitle && opt0 && opt1) {
                    questions.push({
                        title: qTitle,
                        image: qImage,
                        options: [opt0, opt1, opt2 || '選項3', opt3 || '選項4'],
                        correct: correct,
                        timeLimit: 15
                    });
                }
            });

            if (questions.length === 0) {
                alert("請至少完整填寫一題題目！");
                return;
            }

            const quizData = { title, code, questions };

            if (rtdb) {
                try {
                    await rtdb.ref('quizzes/' + code).set(quizData);
                } catch(e) {
                    console.log("RTDB 寫入失敗");
                }
            }

            localQuizzes[code] = quizData;
            localStorage.setItem('huutt_quizzes', JSON.stringify(localQuizzes));

            alert(`測驗 [${title}] 已成功發布並儲存！\n測驗碼為：${code}`);
            
            document.getElementById('adminQuizTitle').value = '';
            document.getElementById('adminQuizCode').value = '';
            document.getElementById('questionBlocksContainer').innerHTML = '';
            addQuestionBlock();
            renderAdminQuizList();
        }

        async function renderAdminQuizList() {
            const listEl = document.getElementById('adminQuizList');
            listEl.innerHTML = '<div class="text-xs text-slate-400">載入測驗列表中...</div>';

            let allQuizzes = { ...localQuizzes };

            if (rtdb) {
                try {
                    const snapshot = await rtdb.ref('quizzes').once('value');
                    if (snapshot.exists()) {
                        snapshot.forEach(childSnap => {
                            allQuizzes[childSnap.key] = childSnap.val();
                        });
                    }
                } catch(e) {
                    console.log("RTDB 取得列表失敗");
                }
            }

            globalAllQuizzes = allQuizzes; // 存起來供匯出使用
            const keys = Object.keys(allQuizzes);
            
            if (keys.length === 0) {
                listEl.innerHTML = '<div class="text-xs text-slate-400">目前尚無已發布的測驗</div>';
                return;
            }

            listEl.innerHTML = '';
            keys.forEach(k => {
                const item = allQuizzes[k];
                if (!item) return;
                const div = document.createElement('div');
                div.className = 'flex justify-between items-center bg-white p-3 rounded-xl border border-slate-200 shadow-sm';
                div.innerHTML = `
                    <div>
                        <span class="font-black text-slate-800 text-sm">${escapeHtml(item.title || '未命名')}</span>
                        <span class="text-xs text-blue-600 font-bold ml-2">(${k})</span>
                    </div>
                    <div class="flex items-center space-x-2">
                        <button onclick="exportQuizToJson('${k}')" class="bg-slate-100 hover:bg-slate-200 text-slate-700 px-3 py-1.5 rounded-lg text-xs font-bold transition">
                            <i class="fa-solid fa-download mr-1"></i>匯出
                        </button>
                        <button onclick="deleteQuiz('${k}')" class="text-brand-red hover:bg-red-50 p-2 rounded-lg text-xs font-bold transition">
                            <i class="fa-solid fa-trash mr-1"></i>刪除
                        </button>
                    </div>
                `;
                listEl.appendChild(div);
            });
        }

        async function deleteQuiz(code) {
            if (!confirm(`確定要刪除測驗碼為 [${code}] 的測驗嗎？此動作無法復原！`)) {
                return;
            }

            if (rtdb) {
                try {
                    await rtdb.ref('quizzes/' + code).remove();
                    await rtdb.ref('leaderboards/' + code).remove();
                } catch(e) {
                    console.log("RTDB 刪除失敗");
                }
            }

            delete localQuizzes[code];
            localStorage.setItem('huutt_quizzes', JSON.stringify(localQuizzes));
            localStorage.removeItem(`scores_${code}`);

            alert(`已成功刪除測驗 [${code}]`);
            renderAdminQuizList();
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.toString().replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }
    </script>
</body>
</html>
